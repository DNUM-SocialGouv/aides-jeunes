label: Aides au paiement des factures d’énergie et de fluides
institution: ccas-de-saint-louis
description: >-
  Cette aide peut contribuer au paiement d’une facture ou à la mise en place
  d’un plan pour réduire une dette. Elle intervient en complément des
  dispositifs de droit commun. En cas de consommation d’eau anormalement élevée,
  le besoin d’un diagnostic de votre installation privée peut aussi être étudié.
  Même si le titre officiel vise les fluides domestiques, l’aide au gaz n’est
  pas déployée à ce jour.
conditions:
  - >-
    • Vous habitez Saint-Louis depuis au moins 3 mois. • Vos ressources
    respectent le plafond correspondant à votre foyer (voir la page « Plafonds
    de ressources »). • Vous êtes une personne seule, un couple sans enfant ou
    un foyer comprenant une personne majeure à charge, selon les règles de la
    mesure. • La facture concerne votre résidence principale et reste à votre
    charge.
instructions: https://fiches.acadis.re/02.pdf
periodicite: ponctuelle
