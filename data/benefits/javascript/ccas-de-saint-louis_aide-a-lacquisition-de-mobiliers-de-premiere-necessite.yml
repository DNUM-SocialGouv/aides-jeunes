label: Aide à l’acquisition de mobiliers de première nécessité
institution: ccas-de-saint-louis
description: >-
  Cette aide concerne des équipements nécessaires à la vie quotidienne :
  cuisiner, conserver les aliments, laver le linge, disposer d’eau chaude ou
  ranger les effets personnels. Elle peut être demandée lorsqu’un appareil
  essentiel est hors d’usage et non réparable, lors de l’entrée dans un logement
  insuffisamment équipé, ou après un évènement climatique. Le CCAS vérifie que
  l’achat demandé répond à un besoin réel et prioritaire.
conditions:
  - >-
    • Vous habitez Saint-Louis depuis au moins 3 mois et vos ressources
    respectent le barème applicable (voir la page « Plafonds de ressources »). •
    Vous êtes une personne seule, un couple sans enfant ou un foyer comprenant
    une personne majeure à charge, selon la mesure. • Vous pouvez justifier la
    panne, l’emménagement ou le sinistre. • L’équipement demandé est
    indispensable et adapté à la taille du foyer.
teleservice: https://fiches.acadis.re/03.pdf
periodicite: ponctuelle
