label: Aides budgétaires
institution: ccas-de-saint-louis
description: >-
  L’objectif est de comprendre votre situation, de sécuriser les dépenses
  essentielles et de construire des solutions durables. L’accompagnement peut
  porter sur l’ouverture de droits, la négociation avec des créanciers, la mise
  en place d’échéanciers ou la préparation d’un dossier de surendettement. Une
  aide du CCAS peut être intégrée au plan d’accompagnement lorsqu’elle est
  nécessaire et décidée par la Commission permanente.
conditions:
  - >-
    • Vous habitez Saint-Louis depuis au moins 3 mois. • Vos ressources
    respectent le barème du CCAS (voir la page « Plafonds de ressources »). •
    Vos difficultés budgétaires sont récurrentes ou vos dettes mettent en danger
    les dépenses essentielles. • Vous acceptez d’examiner l’ensemble du budget
    et de vous engager dans les démarches convenues. • Toutes les compositions
    familiales prévues par le règlement peuvent être concernées.
instructions: https://fiches.acadis.re/04.pdf
periodicite: ponctuelle
