conditions:
  - Être inscrit ou inscrite dans un établissement d’enseignement ou de formation de la Région Nouvelle-Aquitaine et réaliser un séjour
    d'études à l’étranger dans le cadre d'un cursus en formation initiale ou continue.
  - Ne pas cumuler pour le même séjour une autre aide de la Région Nouvelle-Aquitaine, une aide à la mobilité internationale (AMI) ou une aide Erasmus+.
  - Ne pas bénéficier pour ce séjour d'une participation d'un opérateur de compétences (OPCO) supérieure ou égale à 700 € par mois.
  - Déposer une demande avant le début du séjour d'études.
