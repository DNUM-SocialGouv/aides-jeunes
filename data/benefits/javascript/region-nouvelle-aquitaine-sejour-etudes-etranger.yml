label: Séjour d'étude à l'étranger
institution: region_nouvelle_aquitaine
description:
  La Région Nouvelle-Aquitaine finance en partie la réalisation d'un séjour d'études à
  l'étranger d'une durée minimale de 8 semaines consécutives, dans la limite de 26 semaines
  par année universitaire.
prefix: les
