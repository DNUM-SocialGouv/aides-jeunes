label: "Bourse communale au permis de conduire : Pass’Permis"
institution: ville-de-roubaix
description:
  "Cette aide permet aux  jeunes roubaisien·es qui s’inscrivent dans une
  démarche d’insertion professionnelle de bénéficier du financement d'une partie de
  leur permis B, en échange de 35 heures de travail bénévole dans un service de la
  Ville. La prochaine session d'inscription aura lieu en septembre 2024."
prefix: la
conditions_generales:
  - type: communes
    values:
      - "59512"
  - type: age
    operator: ">="
    value: 18
  - type: age
    operator: <=
    value: 25
profils: []
conditions:
  - Être en recherche d’emploi, en formation ou engagé dans un parcours
    d’insertion professionnelle.
  - "Avoir besoin du permis B (ex : indispensable pour une prise de poste rapide)."
  - Ne pas être inscrit dans une autre auto‑école, ni avoir commencé une formation
    au permis.
  - Ne pas bénéficier d’une autre aide pour le permis.
  - Avoir effectué sa Journée d’appel à la défense.
voluntary_conditions:
  - Réaliser entre 35 et 50 heures d'action bénévole auprès d’une association, d’un service municipal ou d’un organisme partenaire
interestFlag: _interetPermisDeConduire
type: float
unit: €
