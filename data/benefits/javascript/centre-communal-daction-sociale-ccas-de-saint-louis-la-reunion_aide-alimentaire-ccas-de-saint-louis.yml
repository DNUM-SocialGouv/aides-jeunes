label: Aide alimentaire – CCAS de Saint-Louis
institution: centre-communal-daction-sociale-ccas-de-saint-louis-la-reunion
description: >-
  Le Centre communal d’action sociale (CCAS) de Saint-Louis propose une aide
  alimentaire aux habitants rencontrant des difficultés financières urgentes ou
  ponctuelles pour se nourrir.

  Cette aide peut prendre la forme de Chèques d’accompagnement personnalisé
  (CAP), utilisables pour acheter des produits autorisés dans les commerces qui
  les acceptent.

  Elle vise à répondre à un besoin alimentaire immédiat lorsque les ressources
  du foyer ou les autres aides disponibles ne permettent pas de faire face à la
  situation.

  Le montant et les modalités de l’aide sont déterminés après une évaluation
  sociale. L’attribution n’est pas automatique et dépend de la décision du CCAS.

  Il s’agit d’une aide ponctuelle, qui ne constitue pas un versement mensuel
  régulier.
conditions:
  - 'Pour solliciter cette aide, vous devez :'
  - '- Résider à Saint-Louis (La Réunion) depuis au moins 3 mois.'
  - >-
    - Disposer de ressources ne dépassant pas le plafond fixé par le CCAS selon
    la composition du foyer.
  - >-
    - Rencontrer une difficulté alimentaire urgente ou ponctuelle qui ne peut
    être résolue immédiatement par vos ressources ou d'autres aides.
  - >-
    - Être une personne seule, un couple avec ou sans enfant, ou un foyer
    comprenant une personne majeure à charge.
  - >-
    Les jeunes de 15 à 30 ans peuvent être concernés, sous réserve de remplir
    les conditions du dispositif. L'aide n'est pas spécifiquement réservée aux
    jeunes.
  - 'Documents à préparer :'
  - '- Une pièce d''identité.'
  - '- Un justificatif de domicile récent.'
  - >-
    - Les justificatifs de toutes les ressources du foyer : salaires,
    allocations, retraites, indemnités, pensions, etc.
  - '- Tout document permettant d''expliquer la difficulté rencontrée.'
  - 'Comment faire la demande :'
  - 1. Se présenter dans une agence du CCAS ou contacter un travailleur social.
  - 2. Transmettre les pièces nécessaires à la constitution du dossier.
  - 3. Participer à l'évaluation sociale réalisée par un professionnel.
  - >-
    4. Attendre l'instruction du dossier et la décision de la personne habilitée
    ou de la Commission permanente.
  - >-
    5. En cas d'accord, recevoir les modalités d'utilisation des chèques
    d'accompagnement personnalisé.
